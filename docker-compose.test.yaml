services:
  db-test:
    image: docker.io/library/postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: gets_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    restart: "no"
