limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    # 安全標頭設定 (CSP, X-Frame, X-Content-Type)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';" always;

    # Swagger 文件
    location ^~ /swagger/ {
        proxy_pass http://backend:8080/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /swagger {
        return 301 /swagger/;
    }

    # 登入端點限流與防爆破
    location = /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # 覆蓋而非追加，防止偽造 XFF
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 針對公開通報與查詢 API 的特殊限速路由定義
    location /api/public/ {
        limit_req zone=public_api_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 轉發其餘 API 請求給 Go 後端
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 Single Page Application 靜態資源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
