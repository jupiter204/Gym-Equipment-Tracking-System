# Nginx Production Configuration with SSL and Cloudflare Real IP Support

limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

# 1. HTTP Server - Redirect all HTTP traffic to HTTPS (301 Moved Permanently)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - SSL/TLS Termination
server {
    listen 443 ssl default_server;
    server_name _;
    charset utf-8;

    # SSL 憑證路徑 (可放置 Cloudflare Origin CA 憑證或 Let's Encrypt 憑證)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL/TLS 現代安全協議與演算法設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare 反向代理真實用戶 IP 還原
    # 確保 rate limit 與審核日誌記錄的是訪客真實 IP 而非 Cloudflare 邊緣節點 IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 安全標頭設定
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';" always;

    # 正式環境停用 Swagger API 文件
    location ^~ /swagger/ {
        return 404;
    }
    location = /swagger {
        return 404;
    }

    # 登入端點限流與防爆破
    location = /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 針對公開通報與查詢 API 的特殊限速路由定義
    location /api/public/ {
        limit_req zone=public_api_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 轉發其餘 API 請求給 Go 後端
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 前端 Single Page Application 靜態資源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
