services:
  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - backend
    networks:
      - frontend-net
    restart: always

  backend:
    build: ./backend
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-equipment_db}
      - JWT_SECRET=${JWT_SECRET:-please_generate_and_change_to_a_secure_jwt_secret_with_at_least_32_bytes!}
      - PORT=8080
      - GIN_MODE=release
      - TZ=Asia/Taipei
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    restart: always

  db:
    image: docker.io/library/postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-equipment_db}
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
      - ./db/seed_dev.sql:/docker-entrypoint-initdb.d/02-seed_dev.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    restart: always

volumes:
  postgres18_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true